services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internship_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d internship_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/internship_catalog?schema=public
      PORT: 3000
      NODE_ENV: development
      FRONTEND_ORIGIN: http://localhost:8080
      UPLOAD_DIR: uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data: